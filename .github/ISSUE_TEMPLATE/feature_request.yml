name: Feature request
description: Suggest a useful improvement for writers or readers.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested behavior
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
